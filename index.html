<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aube — 夜明けの目覚まし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --midnight:   #0a0d14;
  --deep-navy:  #0f1522;
  --navy:       #141d2e;
  --surface:    #1a2338;
  --surface-hi: #1f2a40;
  --rim:        #2a3654;
  --rim-glow:   #364570;
  --muted:      #4a5a7a;
  --dim:        #7a8fad;
  --silver:     #b8c8dc;
  --pale:       #dce6f0;
  --dawn-gold:  #d4a96a;
  --dawn-warm:  #e8c48a;
  --dawn-pale:  #f5e4c4;
  --rose-mist:  #c4829a;
  --danger:     #c4607a;
  --safe:       #7ab89a;
  --r: 0.875rem;
}

/* ═══════════════════════════════════════════
   BASE
═══════════════════════════════════════════ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { height: 100%; }

body {
  min-height: 100%;
  background: var(--midnight);
  color: var(--silver);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  position: relative;
}

/* ── atmospheric sky background ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,169,106,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 20% 100%, rgba(15,21,34,0.9) 0%, transparent 50%),
    radial-gradient(ellipse 40% 40% at 80% 90%, rgba(196,130,154,0.04) 0%, transparent 50%),
    linear-gradient(175deg, #0c1020 0%, #0a0d14 40%, #080b11 100%);
  pointer-events: none; z-index: 0;
}

/* ── stars ── */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(1px 1px at  8% 12%, rgba(220,230,240,0.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 18%  5%, rgba(220,230,240,0.25)0%,transparent 100%),
    radial-gradient(1px 1px at 32% 18%, rgba(220,230,240,0.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 55%  8%, rgba(220,230,240,0.2) 0%,transparent 100%),
    radial-gradient(1px 1px at 71% 22%, rgba(220,230,240,0.35)0%,transparent 100%),
    radial-gradient(1px 1px at 88%  6%, rgba(220,230,240,0.28)0%,transparent 100%),
    radial-gradient(1px 1px at 92% 30%, rgba(220,230,240,0.18)0%,transparent 100%),
    radial-gradient(1px 1px at 44% 35%, rgba(220,230,240,0.22)0%,transparent 100%),
    radial-gradient(1px 1px at 14% 42%, rgba(220,230,240,0.15)0%,transparent 100%),
    radial-gradient(1px 1px at 63% 40%, rgba(220,230,240,0.2) 0%,transparent 100%);
  pointer-events: none; z-index: 0;
  animation: twinkle 8s ease-in-out infinite alternate;
}
@keyframes twinkle {
  0%   { opacity: 0.6; }
  50%  { opacity: 1; }
  100% { opacity: 0.7; }
}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.wrapper {
  position: relative; z-index: 1;
  width: 100%; max-width: 520px;
  padding: 48px 24px 80px;
  animation: pageIn 1s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes pageIn {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
header {
  text-align: center;
  margin-bottom: 52px;
}

.brand {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(3rem, 10vw, 4.5rem);
  letter-spacing: 0.18em;
  background: linear-gradient(135deg, var(--dawn-pale) 0%, var(--dawn-gold) 50%, var(--rose-mist) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  filter: drop-shadow(0 0 24px rgba(212,169,106,0.25));
}

.brand-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 0.85rem;
  color: var(--muted);
  letter-spacing: 0.35em;
  margin-top: 8px;
}

/* ═══════════════════════════════════════════
   CLOCK
═══════════════════════════════════════════ */
.clock-card {
  position: relative;
  background: linear-gradient(145deg, var(--surface), var(--navy));
  border: 1px solid var(--rim);
  border-radius: 20px;
  padding: 36px 32px 32px;
  text-align: center;
  margin-bottom: 20px;
  overflow: hidden;
}
.clock-card::before {
  content:'';
  position:absolute; top:0; left:15%; right:15%; height:1px;
  background: linear-gradient(90deg, transparent, rgba(212,169,106,0.4), transparent);
}

.time-big {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(3.5rem, 16vw, 6rem);
  letter-spacing: 0.04em;
  color: var(--pale);
  line-height: 1;
  text-shadow: 0 0 40px rgba(184,200,220,0.15);
}

.time-big .colon {
  display: inline-block;
  animation: colonBlink 1s step-end infinite;
  color: var(--muted);
}
@keyframes colonBlink {
  0%,100%{ opacity:1; }
  50%    { opacity:0.2; }
}

.time-seconds {
  font-size: clamp(1.2rem, 4vw, 1.8rem);
  color: var(--muted);
  vertical-align: super;
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  margin-left: 4px;
}

.date-line {
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.28em;
  margin-top: 12px;
  text-transform: uppercase;
}

/* ═══════════════════════════════════════════
   ALARM ACTIVE BADGE
═══════════════════════════════════════════ */
.alarm-badge {
  display: none;
  position: relative;
  background: linear-gradient(135deg, rgba(26,35,56,0.9), rgba(20,29,46,0.9));
  border: 1px solid rgba(212,169,106,0.35);
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 20px;
  overflow: hidden;
}
.alarm-badge.visible {
  display: flex;
  align-items: center;
  gap: 16px;
  animation: slideDown 0.4s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideDown {
  from { opacity:0; transform:translateY(-10px); }
  to   { opacity:1; transform:translateY(0); }
}
.alarm-badge::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(90deg, rgba(212,169,106,0.05), transparent 60%);
  pointer-events:none;
}

.badge-icon {
  font-size: 1.5rem;
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100%{ transform:scale(1); }
  50%    { transform:scale(1.12); }
}

.badge-info { flex:1; }

.badge-label {
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  color: var(--muted);
  text-transform: uppercase;
}

.badge-time {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2rem;
  font-weight: 400;
  color: var(--dawn-warm);
  line-height: 1.1;
  letter-spacing: 0.06em;
}

.badge-countdown {
  font-size: 0.7rem;
  color: var(--dim);
  margin-top: 2px;
}
.badge-countdown em { color: var(--dawn-gold); font-style: normal; }

/* ═══════════════════════════════════════════
   SECTION CARDS
═══════════════════════════════════════════ */
.section {
  background: linear-gradient(145deg, var(--surface), var(--navy));
  border: 1px solid var(--rim);
  border-radius: 18px;
  padding: 22px 22px 18px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.section::after {
  content:'';
  position:absolute; bottom:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, var(--rim), transparent);
}

.sec-label {
  font-size: 0.6rem;
  letter-spacing: 0.35em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sec-label::before {
  content:'';
  width: 14px; height: 1px;
  background: var(--dawn-gold);
  opacity: 0.6;
}

/* ═══════════════════════════════════════════
   CUSTOM TIME PICKER
═══════════════════════════════════════════ */
.time-picker-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.picker-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.picker-label {
  font-size: 0.55rem;
  letter-spacing: 0.25em;
  color: var(--muted);
  text-transform: uppercase;
}

.picker-select {
  appearance: none;
  -webkit-appearance: none;
  background: var(--surface-hi);
  border: 1px solid var(--rim);
  border-radius: 10px;
  color: var(--pale);
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem;
  font-weight: 300;
  letter-spacing: 0.04em;
  width: 90px;
  text-align: center;
  padding: 10px 8px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
  /* force dark scrollbar in option dropdown */
  color-scheme: dark;
}
.picker-select:hover {
  border-color: var(--rim-glow);
  background: var(--surface);
}
.picker-select:focus {
  border-color: rgba(212,169,106,0.6);
  box-shadow: 0 0 0 3px rgba(212,169,106,0.08);
}
/* style the native options */
.picker-select option {
  background: var(--surface);
  color: var(--pale);
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
}

.time-colon-sep {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.4rem;
  color: var(--muted);
  padding: 0 2px;
  margin-top: -18px;
  user-select: none;
  line-height: 1;
}

/* ═══════════════════════════════════════════
   URL INPUT
═══════════════════════════════════════════ */
.url-field {
  position: relative;
}

.url-input {
  width: 100%;
  background: var(--surface-hi);
  border: 1px solid var(--rim);
  border-radius: 10px;
  padding: 13px 16px 13px 42px;
  color: var(--pale);
  font-family: 'Outfit', sans-serif;
  font-size: 0.82rem;
  font-weight: 300;
  outline: none;
  transition: border-color 0.25s, box-shadow 0.25s;
  color-scheme: dark;
}
.url-input:focus {
  border-color: rgba(212,169,106,0.5);
  box-shadow: 0 0 0 3px rgba(212,169,106,0.07);
}
.url-input::placeholder { color: var(--muted); }

.url-icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 0.9rem;
  opacity: 0.4;
  pointer-events: none;
}

.url-valid {
  display: none;
  margin-top: 8px;
  font-size: 0.68rem;
  color: var(--safe);
  letter-spacing: 0.05em;
}
.url-valid.show { display: flex; align-items: center; gap: 6px; }

/* ═══════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════ */
.btn-primary {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, rgba(212,169,106,0.15), rgba(232,196,138,0.08));
  border: 1px solid rgba(212,169,106,0.45);
  border-radius: 14px;
  color: var(--dawn-warm);
  font-family: 'Outfit', sans-serif;
  font-size: 0.82rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: hidden;
  margin-top: 4px;
}
.btn-primary::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(135deg, rgba(212,169,106,0.1), transparent);
  opacity:0;
  transition: opacity 0.3s;
}
.btn-primary:hover { 
  border-color: rgba(212,169,106,0.7);
  box-shadow: 0 4px 20px rgba(212,169,106,0.12);
  transform: translateY(-1px);
}
.btn-primary:hover::before { opacity:1; }
.btn-primary:active { transform: translateY(0) scale(0.99); }

.btn-ghost {
  width: 100%;
  padding: 13px;
  background: transparent;
  border: 1px solid var(--rim);
  border-radius: 12px;
  color: var(--muted);
  font-family: 'Outfit', sans-serif;
  font-size: 0.78rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
  display: none;
}
.btn-ghost.show { display: block; }
.btn-ghost:hover {
  border-color: rgba(196,96,122,0.5);
  color: var(--danger);
}

/* ═══════════════════════════════════════════
   PLAYER OVERLAY
═══════════════════════════════════════════ */
.overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(5,7,12,0.97);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 24px;
}
.overlay.show {
  display: flex;
  animation: fadeIn 0.6s cubic-bezier(0.16,1,0.3,1);
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}

.overlay-title {
  text-align: center;
}
.overlay-greeting {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: clamp(1.4rem, 5vw, 2rem);
  color: var(--dawn-warm);
  letter-spacing: 0.1em;
  filter: drop-shadow(0 0 20px rgba(212,169,106,0.4));
}
.overlay-sub {
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-top: 6px;
}

.player-frame {
  width: min(90vw, 720px);
  aspect-ratio: 16/9;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--rim);
  box-shadow: 0 0 60px rgba(212,169,106,0.08);
}
.player-frame iframe {
  width: 100%; height: 100%; border: none; display: block;
}

.overlay-message {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  background: linear-gradient(135deg, rgba(26,35,56,0.8), rgba(20,29,46,0.8));
  border: 1px solid rgba(212,169,106,0.25);
  border-radius: 20px;
  padding: 32px 48px;
}

.overlay-msg-icon {
  font-size: 2.8rem;
  animation: sunrise 3s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 16px rgba(212,169,106,0.5));
}
@keyframes sunrise {
  from { transform: translateY(4px); opacity: 0.7; }
  to   { transform: translateY(-4px); opacity: 1; }
}

.overlay-msg-text {
  font-size: 0.85rem;
  color: var(--silver);
  letter-spacing: 0.12em;
}

.overlay-open-btn {
  display: inline-block;
  padding: 16px 40px;
  background: linear-gradient(135deg, rgba(212,169,106,0.2), rgba(232,196,138,0.1));
  border: 1px solid rgba(212,169,106,0.6);
  border-radius: 14px;
  color: var(--dawn-warm);
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-decoration: none;
  transition: all 0.25s;
  box-shadow: 0 0 24px rgba(212,169,106,0.12);
  animation: glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 16px rgba(212,169,106,0.1); border-color: rgba(212,169,106,0.5); }
  50%     { box-shadow: 0 0 32px rgba(212,169,106,0.3); border-color: rgba(212,169,106,0.9); }
}
.overlay-open-btn:hover {
  background: linear-gradient(135deg, rgba(212,169,106,0.3), rgba(232,196,138,0.15));
  transform: scale(1.03);
}

.overlay-msg-hint {
  font-size: 0.62rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.8;
  letter-spacing: 0.05em;
}

.overlay-link {
  font-size: 0.72rem;
  color: var(--dawn-gold);
  letter-spacing: 0.2em;
  text-decoration: none;
  border-bottom: 1px solid rgba(212,169,106,0.3);
  padding-bottom: 2px;
  transition: border-color 0.2s, color 0.2s;
}
.overlay-link:hover {
  color: var(--dawn-warm);
  border-color: rgba(232,196,138,0.6);
}
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn-snooze {
  padding: 13px 28px;
  background: transparent;
  border: 1px solid rgba(212,169,106,0.4);
  border-radius: 12px;
  color: var(--dawn-gold);
  font-family: 'Outfit', sans-serif;
  font-size: 0.78rem;
  font-weight: 300;
  letter-spacing: 0.18em;
  cursor: pointer;
  transition: all 0.25s;
}
.btn-snooze:hover { background: rgba(212,169,106,0.08); }

.btn-dismiss {
  padding: 13px 28px;
  background: transparent;
  border: 1px solid rgba(196,96,122,0.35);
  border-radius: 12px;
  color: var(--danger);
  font-family: 'Outfit', sans-serif;
  font-size: 0.78rem;
  font-weight: 300;
  letter-spacing: 0.18em;
  cursor: pointer;
  transition: all 0.25s;
}
.btn-dismiss:hover { background: rgba(196,96,122,0.08); }

/* ═══════════════════════════════════════════
   FOOTER NOTE
═══════════════════════════════════════════ */
.note {
  font-size: 0.62rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.8;
  margin-top: 8px;
  opacity: 0.7;
}

/* ── scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rim); border-radius: 2px; }
</style>
</head>
<body>

<div class="wrapper">

  <!-- ─── Header ─── -->
  <header>
    <div class="brand">Aube</div>
    <div class="brand-sub">夜明けを告げる目覚まし</div>
  </header>

  <!-- ─── Current Time ─── -->
  <div class="clock-card">
    <div class="time-big">
      <span id="ch">--</span><span class="colon">:</span><span id="cm">--</span><span class="time-seconds" id="cs">--</span>
    </div>
    <div class="date-line" id="dateStr">—</div>
  </div>

  <!-- ─── Alarm Active Badge ─── -->
  <div class="alarm-badge" id="alarmBadge">
    <div class="badge-icon">☽</div>
    <div class="badge-info">
      <div class="badge-label">Alarm Set</div>
      <div class="badge-time" id="badgeTime">--:--</div>
      <div class="badge-countdown">あと <em id="badgeCountdown">--</em></div>
    </div>
  </div>

  <!-- ─── Alarm Time Picker ─── -->
  <div class="section">
    <div class="sec-label">アラーム時刻</div>
    <div class="time-picker-row">
      <div class="picker-group">
        <select class="picker-select" id="pickHour" aria-label="時"></select>
        <div class="picker-label">時</div>
      </div>
      <div class="time-colon-sep">:</div>
      <div class="picker-group">
        <select class="picker-select" id="pickMin" aria-label="分"></select>
        <div class="picker-label">分</div>
      </div>
    </div>
  </div>

  <!-- ─── YouTube URL ─── -->
  <div class="section">
    <div class="sec-label">YouTube URL</div>
    <div class="url-field">
      <span class="url-icon">▶</span>
      <input type="text" class="url-input" id="urlInput"
        placeholder="https://www.youtube.com/watch?v=..."
        autocomplete="off" spellcheck="false">
    </div>
    <div class="url-valid" id="urlValid">
      <span>✦</span> 動画を認識しました
    </div>
    <p class="note" style="margin-top:10px;">YouTubeのURLをそのまま貼り付けてください<br>アラーム時刻になるとこのページがYouTubeに自動で切り替わります</p>
  </div>

  <!-- ─── Set / Cancel ─── -->
  <button class="btn-primary" id="setBtn" onclick="handleSet()">
    アラームをセット
  </button>
  <button class="btn-ghost" id="cancelBtn" onclick="handleCancel()">
    キャンセル
  </button>

</div><!-- /wrapper -->

<!-- ═══════════════════════════════════════════
     SCRIPT
═══════════════════════════════════════════ -->
<script>
/* ══════════════════════════════════════════
   STATE — localStorage で永続化
   キー: aube_alarm = JSON { h, m, videoId }
══════════════════════════════════════════ */
const STORAGE_KEY = 'aube_alarm';

function saveAlarm(h, m, vid) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ h, m, videoId: vid }));
}
function loadAlarm() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
}
function clearAlarm() {
  localStorage.removeItem(STORAGE_KEY);
}

/* ── 起動時: 保存済みアラームを復元 ── */
let alarm = loadAlarm(); // { h, m, videoId } | null
let fired = false;

/* ── Populate selects ── */
const hourSel = document.getElementById('pickHour');
const minSel  = document.getElementById('pickMin');
for (let h = 0; h < 24; h++) hourSel.add(new Option(String(h).padStart(2,'0'), h));
for (let m = 0; m < 60; m++) minSel.add(new Option(String(m).padStart(2,'0'), m));

/* ── 保存済みアラームをUIに反映 ── */
function restoreUI() {
  if (!alarm) return;
  hourSel.value = alarm.h;
  minSel.value  = alarm.m;
  document.getElementById('urlInput').value = `https://www.youtube.com/watch?v=${alarm.videoId}`;
  document.getElementById('urlValid').classList.add('show');
  const tStr = `${String(alarm.h).padStart(2,'0')}:${String(alarm.m).padStart(2,'0')}`;
  document.getElementById('badgeTime').textContent = tStr;
  document.getElementById('alarmBadge').classList.add('visible');
  document.getElementById('setBtn').textContent = 'アラームを更新';
  document.getElementById('cancelBtn').classList.add('show');
}
restoreUI();

/* ── Clock ── */
const weekdays = ['日','月','火','水','木','金','土'];

function tick() {
  const n = new Date();
  document.getElementById('ch').textContent = String(n.getHours()).padStart(2,'0');
  document.getElementById('cm').textContent = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('cs').textContent = String(n.getSeconds()).padStart(2,'0');
  document.getElementById('dateStr').textContent =
    `${n.getFullYear()} . ${String(n.getMonth()+1).padStart(2,'0')} . ${String(n.getDate()).padStart(2,'0')} — ${weekdays[n.getDay()]}曜日`;
  if (alarm && !fired) checkAlarm(n);
  if (alarm) updateCountdown(n);
}
setInterval(tick, 1000);
tick();

/* ── Video ID extraction ── */
function extractId(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
document.getElementById('urlInput').addEventListener('input', function() {
  document.getElementById('urlValid').classList.toggle('show', !!extractId(this.value));
});

/* ── Set alarm ── */
function handleSet() {
  const h  = parseInt(hourSel.value);
  const m  = parseInt(minSel.value);
  const id = extractId(document.getElementById('urlInput').value.trim());
  if (isNaN(h) || isNaN(m)) { showToast('時刻を設定してください'); return; }
  if (!id) { showToast('有効なYouTube URLを入力してください'); return; }

  alarm = { h, m, videoId: id };
  fired = false;
  saveAlarm(h, m, id);

  const tStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.getElementById('badgeTime').textContent = tStr;
  document.getElementById('alarmBadge').classList.add('visible');
  document.getElementById('setBtn').textContent = 'アラームを更新';
  document.getElementById('cancelBtn').classList.add('show');
  showToast('アラームをセットしました ✦');
}

function handleCancel() {
  alarm = null; fired = false;
  clearAlarm();
  document.getElementById('alarmBadge').classList.remove('visible');
  document.getElementById('cancelBtn').classList.remove('show');
  document.getElementById('setBtn').textContent = 'アラームをセット';
}

/* ── Countdown ── */
function updateCountdown(now) {
  if (!alarm) return;
  let target = new Date(now);
  target.setHours(alarm.h, alarm.m, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const diff = Math.floor((target - now) / 1000);
  const hh = Math.floor(diff / 3600);
  const mm = Math.floor((diff % 3600) / 60);
  const ss = diff % 60;
  let t = '';
  if (hh) t += `${hh}時間`;
  if (mm || hh) t += `${mm}分`;
  t += `${String(ss).padStart(2,'0')}秒`;
  document.getElementById('badgeCountdown').textContent = t;
}

/* ── Check & fire ── */
function checkAlarm(now) {
  if (!alarm || fired) return;
  if (now.getHours() === alarm.h && now.getMinutes() === alarm.m) {
    fired = true;
    fireAlarm();
  }
}

/* ── Fire: このページ自体をYouTubeにリダイレクト ──
   window.location.href はブラウザのポップアップブロック対象外。
   確実に遷移する。
── */
function fireAlarm() {
  // window.location.href はポップアップブロック対象外 — 確実にYouTubeへ遷移
  window.location.href = `https://www.youtube.com/watch?v=${alarm.videoId}&autoplay=1`;
}

/* ── Toast ── */
function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position:'fixed', bottom:'32px', left:'50%', transform:'translateX(-50%)',
    background:'rgba(26,35,56,0.95)', border:'1px solid rgba(212,169,106,0.3)',
    color:'#d4a96a', padding:'12px 24px', borderRadius:'10px',
    fontFamily:"'Outfit',sans-serif", fontSize:'0.78rem', letterSpacing:'0.08em',
    zIndex:'999', whiteSpace:'nowrap', boxShadow:'0 4px 20px rgba(0,0,0,0.4)',
    animation:'fadeIn 0.3s ease'
  });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
</script>
</body>
</html>
